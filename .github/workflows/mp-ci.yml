name: 微信小程序 CI

# 推送到 master（含 PR 合并）即上传微信；用 package.json 的 version 打 tag。
# 若同名 tag 已存在则直接失败，需先改 package.json 的 version 再推。
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      robot:
        description: CI 机器人编号 1-30
        required: false
        default: '1'

concurrency:
  group: mp-ci-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm install

      - name: Resolve version & tag
        id: meta
        shell: bash
        run: |
          set -e
          git fetch --tags --force origin

          VER="$(node -p "require('./package.json').version")"
          TAG="v${VER}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::远程已存在 tag ${TAG}。请先修改 package.json 的 version 后再推送到 master。"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

          DESC="ci ${VER} (${GITHUB_SHA::7})"
          ROBOT="${{ github.event.inputs.robot }}"
          if [ -z "$ROBOT" ]; then ROBOT=1; fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "desc=$DESC" >> "$GITHUB_OUTPUT"
          echo "robot=$ROBOT" >> "$GITHUB_OUTPUT"
          echo "resolved version=$VER tag=${TAG}"

      - name: Upload to WeChat
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
          MP_VERSION: ${{ steps.meta.outputs.version }}
          MP_DESC: ${{ steps.meta.outputs.desc }}
          MP_ROBOT: ${{ steps.meta.outputs.robot }}
        run: |
          if [ -z "$WX_PRIVATE_KEY" ]; then
            echo "缺少 Secrets.WX_PRIVATE_KEY，请按 docs/微信CI.md 配置"
            exit 1
          fi
          node tools/mp-ci.js upload --version "$MP_VERSION" --desc "$MP_DESC" --robot "$MP_ROBOT"
